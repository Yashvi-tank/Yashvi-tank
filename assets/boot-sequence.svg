<svg width="700" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <clipPath id="clip0"><rect x="150" y="50" width="423" height="6" rx="3"/></clipPath>
    <clipPath id="clip1"><rect x="150" y="86" width="405" height="6" rx="3"/></clipPath>
    <clipPath id="clip2"><rect x="150" y="122" width="340" height="6" rx="3"/></clipPath>
    <clipPath id="clip3"><rect x="150" y="158" width="368" height="6" rx="3"/></clipPath>
  </defs>

  <rect width="700" height="200" fill="#0B0F19"/>
  <rect x="0.5" y="0.5" width="699" height="199" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <circle cx="18" cy="20" r="3" fill="#2DD4BF">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="30" y="24" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#94A3B8">FOCUS AREAS</text>

  <g font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" fill="#CBD5E1">
    <text x="16" y="57">Backend</text>
    <text x="16" y="93">AI / ML</text>
    <text x="16" y="129">Security</text>
    <text x="16" y="165">Cloud</text>
  </g>

  <g fill="#161B26">
    <rect x="150" y="50" width="460" height="6" rx="3"/>
    <rect x="150" y="86" width="460" height="6" rx="3"/>
    <rect x="150" y="122" width="460" height="6" rx="3"/>
    <rect x="150" y="158" width="460" height="6" rx="3"/>
  </g>

  <g fill="url(#barGrad)">
    <rect x="150" y="50" height="6" rx="3" opacity="0">
      <animate attributeName="width" values="0;423" dur="1s" begin="0.1s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.1s" fill="freeze"/>
    </rect>
    <rect x="150" y="86" height="6" rx="3" opacity="0">
      <animate attributeName="width" values="0;405" dur="1s" begin="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.3s" fill="freeze"/>
    </rect>
    <rect x="150" y="122" height="6" rx="3" opacity="0">
      <animate attributeName="width" values="0;340" dur="1s" begin="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    </rect>
    <rect x="150" y="158" height="6" rx="3" opacity="0">
      <animate attributeName="width" values="0;368" dur="1s" begin="0.7s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
    </rect>
  </g>

  <g fill="#ffffff" opacity="0.55">
    <rect x="130" y="50" width="46" height="6" clip-path="url(#clip0)">
      <animateTransform attributeName="transform" type="translate" values="0 0;480 0" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="86" width="46" height="6" clip-path="url(#clip1)">
      <animateTransform attributeName="transform" type="translate" values="0 0;480 0" dur="3.2s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="122" width="46" height="6" clip-path="url(#clip2)">
      <animateTransform attributeName="transform" type="translate" values="0 0;480 0" dur="3.2s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="158" width="46" height="6" clip-path="url(#clip3)">
      <animateTransform attributeName="transform" type="translate" values="0 0;480 0" dur="3.2s" begin="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="end">
    <text x="650" y="57" opacity="0">92%<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/></text>
    <text x="650" y="93" opacity="0">88%<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/></text>
    <text x="650" y="129" opacity="0">74%<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/></text>
    <text x="650" y="165" opacity="0">80%<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/></text>
  </g>
</svg>

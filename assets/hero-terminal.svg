<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orbGrad" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="230" fill="#0B0F19"/>
  <rect x="0.5" y="0.5" width="899" height="229" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <ellipse cx="450" cy="95" rx="230" ry="120" fill="url(#orbGrad)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <rect x="-220" y="0" width="220" height="230" fill="url(#shineGrad)">
    <animateTransform attributeName="transform" type="translate" values="0 0;1120 0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="100" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="700" text-anchor="middle" fill="#F1F5F9" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.15;1" dur="1.3s" fill="freeze"/>
    Yashvi Tank
  </text>

  <rect x="450" y="114" width="0" height="3" rx="1.5" fill="url(#textGrad)">
    <animate attributeName="width" values="0;90" dur="0.8s" begin="1s" fill="freeze"/>
    <animate attributeName="x" values="450;405" dur="0.8s" begin="1s" fill="freeze"/>
  </rect>

  <text x="450" y="140" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#94A3B8" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2;1" dur="1.6s" begin="0.3s" fill="freeze"/>
    Full-Stack &amp; AI Engineer — building at the intersection of code and security
  </text>

  <g font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.1s" fill="freeze"/>
      <rect x="280" y="168" width="100" height="26" rx="13" fill="none" stroke="#6366F1" stroke-opacity="0.5"/>
      <text x="330" y="185" text-anchor="middle" fill="#C7D2FE">BACKEND</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.3s" fill="freeze"/>
      <rect x="390" y="168" width="120" height="26" rx="13" fill="none" stroke="#2DD4BF" stroke-opacity="0.5"/>
      <text x="450" y="185" text-anchor="middle" fill="#99F6E4">AI SYSTEMS</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.5s" fill="freeze"/>
      <rect x="520" y="168" width="100" height="26" rx="13" fill="none" stroke="#6366F1" stroke-opacity="0.5"/>
      <text x="570" y="185" text-anchor="middle" fill="#C7D2FE">SECURITY</text>
    </g>
  </g>
</svg>

<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="140" fill="#0B0F19"/>
  <rect x="0.5" y="0.5" width="899" height="139" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <line x1="70" y1="60" x2="830" y2="60" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <circle cy="60" r="5" fill="#2DD4BF" filter="url(#dotGlow)">
    <animate attributeName="cx" values="70;222;374;526;678;830;830" keyTimes="0;0.18;0.36;0.54;0.72;0.9;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.94;0.97;0.99;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Inter','Segoe UI',system-ui,sans-serif">
    <g>
      <circle cx="70" cy="60" r="5" fill="#6366F1" opacity="1">
        <animate attributeName="opacity" values="1;0.55;0.55;1" keyTimes="0;0.05;0.95;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text x="70" y="90" font-size="11" font-weight="600" letter-spacing="0.5" fill="#94A3B8" text-anchor="middle">FEATURE</text>
    </g>
    <g>
      <circle cx="222" cy="60" r="5" fill="#6366F1" opacity="0.55">
        <animate attributeName="opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.16;0.18;0.20;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text x="222" y="90" font-size="11" font-weight="600" letter-spacing="0.5" fill="#94A3B8" text-anchor="middle">BUILD</text>
    </g>
    <g>
      <circle cx="374" cy="60" r="5" fill="#6366F1" opacity="0.55">
        <animate attributeName="opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.34;0.36;0.38;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text x="374" y="90" font-size="11" font-weight="600" letter-spacing="0.5" fill="#94A3B8" text-anchor="middle">TEST</text>
    </g>
    <g>
      <circle cx="526" cy="60" r="5" fill="#2DD4BF" opacity="0.55">
        <animate attributeName="opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.52;0.54;0.56;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text x="526" y="90" font-size="11" font-weight="600" letter-spacing="0.5" fill="#94A3B8" text-anchor="middle">DEBUG</text>
    </g>
    <g>
      <circle cx="678" cy="60" r="5" fill="#2DD4BF" opacity="0.55">
        <animate attributeName="opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.70;0.72;0.74;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text x="678" y="90" font-size="11" font-weight="600" letter-spacing="0.5" fill="#94A3B8" text-anchor="middle">VALIDATE</text>
    </g>
    <g>
      <circle cx="830" cy="60" r="5" fill="#2DD4BF" opacity="0.55">
        <animate attributeName="opacity" values="0.55;0.55;1;1" keyTimes="0;0.88;0.9;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text x="830" y="90" font-size="11" font-weight="600" letter-spacing="0.5" fill="#94A3B8" text-anchor="middle">SHIP</text>
    </g>
  </g>

  <text x="450" y="120" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" fill="#64748B" text-anchor="middle">
    feature branch &#8594; integration env &#8594; gitlab mr &#8594; rebase &#8594; production
  </text>
</svg>

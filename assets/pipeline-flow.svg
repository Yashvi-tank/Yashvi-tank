<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="150" fill="#05010d"/>
  <rect x="1" y="1" width="898" height="148" fill="none" stroke="#00F5FF" stroke-opacity="0.2" stroke-width="1"/>

  <line x1="60" y1="70" x2="840" y2="70" stroke="#00BFFF" stroke-width="2" stroke-dasharray="8 6" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/>
  </line>

  <circle r="6" fill="#00F5FF" filter="url(#nodeGlow)">
    <animate attributeName="cx" values="60;216;372;528;684;840;840" keyTimes="0;0.16;0.32;0.48;0.64;0.8;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;70;70;70;70;70;70" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Fira Code','Courier New',monospace">
    <g>
      <circle cx="60" cy="70" r="19" fill="#0d0b1a" stroke="#8A2BE2" stroke-width="2"/>
      <text x="60" y="75" font-size="10" fill="#c9d1d9" text-anchor="middle">01</text>
      <text x="60" y="112" font-size="12" fill="#c9d1d9" text-anchor="middle">FEATURE</text>
    </g>
    <g>
      <circle cx="216" cy="70" r="19" fill="#0d0b1a" stroke="#8A2BE2" stroke-width="2"/>
      <text x="216" y="75" font-size="10" fill="#c9d1d9" text-anchor="middle">02</text>
      <text x="216" y="112" font-size="12" fill="#c9d1d9" text-anchor="middle">BUILD</text>
    </g>
    <g>
      <circle cx="372" cy="70" r="19" fill="#0d0b1a" stroke="#00BFFF" stroke-width="2"/>
      <text x="372" y="75" font-size="10" fill="#c9d1d9" text-anchor="middle">03</text>
      <text x="372" y="112" font-size="12" fill="#c9d1d9" text-anchor="middle">TEST</text>
    </g>
    <g>
      <circle cx="528" cy="70" r="19" fill="#0d0b1a" stroke="#00BFFF" stroke-width="2"/>
      <text x="528" y="75" font-size="10" fill="#c9d1d9" text-anchor="middle">04</text>
      <text x="528" y="112" font-size="12" fill="#c9d1d9" text-anchor="middle">DEBUG</text>
    </g>
    <g>
      <circle cx="684" cy="70" r="19" fill="#0d0b1a" stroke="#00F5FF" stroke-width="2"/>
      <text x="684" y="75" font-size="10" fill="#c9d1d9" text-anchor="middle">05</text>
      <text x="684" y="112" font-size="12" fill="#c9d1d9" text-anchor="middle">VALIDATE</text>
    </g>
    <g>
      <circle cx="840" cy="70" r="19" fill="#0d0b1a" stroke="#00F5FF" stroke-width="2"/>
      <text x="840" y="75" font-size="10" fill="#c9d1d9" text-anchor="middle">06</text>
      <text x="840" y="112" font-size="12" fill="#c9d1d9" text-anchor="middle">SHIP</text>
    </g>
  </g>

  <text x="450" y="138" font-family="'Fira Code','Courier New',monospace" font-size="11" fill="#8A2BE2" text-anchor="middle" letter-spacing="1">
    <animate attributeName="fill" values="#8A2BE2;#00F5FF;#8A2BE2" dur="4s" repeatCount="indefinite"/>
    feature branch -&gt; integration env -&gt; gitlab mr -&gt; rebase -&gt; production
  </text>
</svg>

name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"     # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Yashvi-tank
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=2DD4BF&color_dots=0B0F19,1e2140,332e77,4a3fb0,6366F1
            dist/github-contribution-grid-snake-dark.svg?color_snake=2DD4BF&color_dots=0B0F19,1e2140,332e77,4a3fb0,6366F1

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
